name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests and generate report
        run: npm run test:e2e:report

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: test-results/qa-report/
          retention-days: 30

      - name: Upload raw Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: test-results/results.json
          retention-days: 30
